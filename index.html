<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DC Searcher</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet"
            href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body class="p-4 md:p-8 bg-slate-50 min-h-screen">
        <div id="loading-screen">
            <div class="spinner"></div>
            <p class="text-gray-700 font-semibold">Connecting to Live Database...</p>
        </div>

        <div class="max-w-6xl mx-auto">
            <header class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-emerald-700 text-white flex items-center justify-center font-bold text-lg shadow-sm">IC</div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">DC Searcher</h1>
                        <p class="text-xs text-gray-500 font-medium">Tactical Logistics & Route Dispatcher</p>
                    </div>
                </div>
                <a href="manage/DC_Manager.html"
                    class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-700 hover:text-emerald-800 bg-white hover:bg-gray-50 px-3.5 py-2 rounded-lg shadow-sm border border-gray-200 transition"
                    title="Manage Distribution Center Data">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>Admin Portal</span>
                </a>
            </header>

            <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-4">
                    <div class="md:col-span-3 relative">
                        <label for="city-input" class="block text-lg font-medium text-gray-700 mb-2">Origin Distribution Center or Loc ID</label>
                        <div class="relative">
                            <input type="text" id="city-input" placeholder="Search origin DC name or Loc ID..."
                                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions-container"
                                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" autocomplete="off" />
                        </div>
                        <div id="suggestions-container" role="listbox" aria-label="Distribution Center suggestions"
                            class="absolute z-[9999] w-full bg-white border border-gray-200 rounded-b-lg shadow-lg mt-1 hidden max-h-72 overflow-y-auto">
                        </div>
                    </div>
                    <div>
                        <label for="radius-input" class="block text-lg font-medium text-gray-700 mb-2">Max Distance (KM)</label>
                        <input type="number" id="radius-input" placeholder="e.g., 200" min="0"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
                    </div>
                    <div>
                        <label for="duration-input" class="block text-lg font-medium text-gray-700 mb-2">Max Duration (HH:MM)</label>
                        <input type="text" id="duration-input" placeholder="e.g., 04:30"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
                    </div>
                </div>
                <div class="flex items-center gap-x-3">
                    <button id="search-button"
                        class="flex-grow bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-3 px-6 rounded-lg shadow-md disabled:bg-gray-200 disabled:text-gray-600 disabled:cursor-not-allowed transition"
                        disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline mr-2" viewBox="0 0 15 20"
                            fill="currentColor" stroke-width="2" aria-hidden="true">
                            <path fill-rule="evenodd"
                                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                                clip-rule="evenodd" />
                        </svg>
                        Find DC
                    </button>
                    <button id="clear-button" title="Clear All"
                        class="flex-shrink-0 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 px-6 rounded-lg shadow-md flex items-center justify-center gap-2 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        Clear
                    </button>
                </div>
                <p id="error-message" role="alert" aria-live="polite" class="text-red-700 font-medium mt-2 hidden"></p>
            </div>

            <div id="results-container" class="map-container p-6 rounded-xl shadow-inner">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    Distribution Centers Near <span id="target-city" class="text-emerald-700">...</span>
                    <span id="factory-count" aria-live="polite" class="text-sm font-normal text-gray-500 ml-2">(0 results)</span>
                </h2>
                <div id="factory-visualizer" class="flex flex-col lg:flex-row gap-8">
                    <div class="lg:w-3/5" style="height: 500px">
                        <div id="map" class="w-full h-full rounded-lg shadow-inner border border-gray-300"></div>
                    </div>
                    <div class="lg:w-2/5">
                        <h3 id="list-title" class="font-semibold text-gray-700 mb-3 border-b pb-1">Detailed List</h3>
                        <div class="flex items-center gap-x-3 mb-3">
                            <div class="relative flex-grow">
                                <label for="list-search-input" class="sr-only">Search within results</label>
                                <input type="text" id="list-search-input" placeholder="Search in results..." aria-label="Search in results"
                                    class="peer w-full p-2 pl-9 text-sm text-gray-800 placeholder:text-gray-400 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none transition-colors" />
                                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-2.5 text-gray-400 peer-focus:text-emerald-600 transition-colors duration-150">
                                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                                    </svg>
                                </div>
                            </div>
                            <button id="clear-comparison-button" title="Clear Selection" aria-label="Clear route comparison selection"
                                class="flex-shrink-0 bg-white hover:bg-gray-50 text-gray-700 font-semibold p-2.5 rounded-lg shadow-sm border border-gray-200 focus:ring-2 focus:ring-emerald-500 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="2" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </button>
                        </div>
                        <div id="factory-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                            <p id="initial-message" class="text-gray-500 italic">
                                Enter a DC name or Loc ID and click "Find DC" to see results.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <footer
                class="mt-8 py-4 text-center text-xs text-gray-500 border-t border-gray-200">
                <p>© 2025 DC Searcher. All rights reserved.</p>
                <p>Source code available on <a href="https://github.com/jonekaa/DC-Searcher" target="_blank"
                        class="text-emerald-700 font-medium hover:underline">GitHub</a></p>
            </footer>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
            import {
                getFirestore,
                collection,
                getDocs,
                doc,
                getDoc
            } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

            const firebaseConfig = {
                apiKey: "AIzaSyDcvUFQtYvwyYGcT4B1Ff4A5s5uXa6u95s",
                authDomain: "dc-searcher-app.firebaseapp.com",
                projectId: "dc-searcher-app",
                storageBucket: "dc-searcher-app.firebasestorage.app",
                messagingSenderId: "739161146197",
                appId: "1:739161146197:web:f4f2fed0e724217d2c25dc",
                measurementId: "G-8HL7244P17"
            };

            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                window.db = db;
                window.getDocs = getDocs;
                window.collection = collection;
                window.doc = doc;
                window.getDoc = getDoc;
                document.dispatchEvent(new Event("firebaseReady"));
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                document.getElementById("loading-screen").innerHTML =
                    `<p class="text-red-500 font-bold">Firebase connection failed!</p>`;
            }
        </script>

        <script src="js/utils.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/app.js"></script>
    </body>

</html>
